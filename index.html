<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Na_style_z — Интернет-магазин косметики в Ташкенте</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #fafafa; color: #333; }
        header { background: #fff; padding: 20px; text-align: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; font-size: 24px; letter-spacing: 2px; color: #d4a373; text-transform: uppercase; }
        header p { margin: 5px 0 0; font-size: 12px; color: #888; text-transform: uppercase; }
        .banner { background: #f4ebd0; padding: 30px 20px; text-align: center; margin-bottom: 20px; }
        .banner h2 { margin: 0; font-size: 18px; color: #5c4d3c; font-weight: normal; }
        .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
        .product-card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
        .product-img { width: 100%; height: 250px; background: #f0f0f0; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 14px; margin-bottom: 10px; }
        .product-title { font-size: 18px; font-weight: 600; margin: 10px 0 5px; }
        .product-price { color: #d4a373; font-weight: bold; font-size: 16px; margin-bottom: 15px; }
        .btn-order { background: #d4a373; color: #fff; border: none; padding: 12px 25px; border-radius: 25px; width: 100%; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        footer { text-align: center; padding: 30px 20px; color: #aaa; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>NA_STYLE_Z</h1>
        <p>Косметика & Подарки • Ташкент</p>
    </header>

    <div class="banner">
        <h2>Онлайн витрина 🫶🏻<br>Подарки при каждой покупке 🛍🎀</h2>
    </div>

    <div class="container">
        <div class="product-card">
            <div class="product-img">Тут будет фото кушона</div>
            <div class="product-title">Трендовый Кушон для лица</div>
            <div class="product-price">145 000 сум</div>
            <button class="btn-order" onclick="makeOrder('Трендовый Кушон для лица', '145 000 сум')">Заказать</button>
        </div>
    </div>

    <footer>
        <p>© 2026 Na_style_z. Доставка по Ташкенту и Узбекистану.</p>
    </footer>

    <script>
                function makeOrder(name, price) {
            // СОЗДАЕМ КРАСИВЫЙ ТЕКСТ ДЛЯ КЛИЕНТА
            let message = `Здравствуйте! Хочу заказать с вашего сайта:\n\n✨ Товар: ${name}\n💰 Цена: ${price}`;
            
            // ОФИЦИАЛЬНАЯ ССЫЛКА ПЕРЕХОДА В ТЕЛЕГРАМ
            // ЗАМЕНИ 'anvar7_creator' НА РЕАЛЬНЫЙ ЮЗЕРНЕЙМ (ЛОГИН) ТВОЕЙ ЗНАКОМОЙ В ТЕЛЕГРАМЕ (без значка @)
            let telegramUsername = "@Anvar_217"; 
            
            let url = `https://t.me{telegramUsername}?text=${encodeURIComponent(message)}`;
            
            // Открываем чат Телеграма в новой вкладке телефона
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
